<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title">
  <title id="title">Why Edits Did Not Appear</title>
  <rect width="1400" height="780" fill="#f7f7f8"/>

  <text x="700" y="52" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#1f1f1f">Why Edits Did Not Appear</text>

  <!-- Left panel: Module 2 Problem -->
  <rect x="40" y="90" width="640" height="640" rx="16" fill="#ffffff" stroke="#c62828" stroke-width="4"/>
  <rect x="60" y="110" width="280" height="44" rx="8" fill="#c62828"/>
  <text x="200" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Module 2 Problem</text>

  <rect x="100" y="190" width="520" height="70" rx="10" fill="#fff5f5" stroke="#c62828" stroke-width="2"/>
  <text x="360" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f1f1f">Apache DocumentRoot</text>
  <text x="360" y="244" text-anchor="middle" font-family="Menlo, Monaco, monospace" font-size="16" fill="#b71c1c">/var/www/html</text>

  <line x1="360" y1="260" x2="360" y2="300" stroke="#c62828" stroke-width="3" marker-end="url(#arrowRed)"/>

  <rect x="100" y="310" width="520" height="70" rx="10" fill="#fff5f5" stroke="#c62828" stroke-width="2"/>
  <text x="360" y="340" text-anchor="middle" font-family="Menlo, Monaco, monospace" font-size="16" fill="#1f1f1f">/var/www/html/index.php</text>
  <text x="360" y="364" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#666666">Copied File</text>

  <line x1="360" y1="380" x2="360" y2="430" stroke="#c62828" stroke-width="3" stroke-dasharray="8 6"/>
  <line x1="340" y1="410" x2="380" y2="450" stroke="#c62828" stroke-width="4"/>
  <line x1="380" y1="410" x2="340" y2="450" stroke="#c62828" stroke-width="4"/>

  <rect x="100" y="460" width="520" height="70" rx="10" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2"/>
  <text x="360" y="490" text-anchor="middle" font-family="Menlo, Monaco, monospace" font-size="16" fill="#1f1f1f">/app/index.php</text>
  <text x="360" y="514" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#666666">Edit Path (Volume Mount)</text>

  <rect x="100" y="560" width="520" height="130" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="360" y="600" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#b71c1c">Copy (Stale)</text>
  <text x="360" y="635" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#333333">Edits at /app/index.php do not affect</text>
  <text x="360" y="658" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#333333">what Apache serves.</text>

  <!-- Right panel: Module 3 Fix -->
  <rect x="720" y="90" width="640" height="640" rx="16" fill="#ffffff" stroke="#2e7d32" stroke-width="4"/>
  <rect x="740" y="110" width="220" height="44" rx="8" fill="#2e7d32"/>
  <text x="850" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Module 3 Fix</text>

  <rect x="780" y="190" width="520" height="70" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="1040" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f1f1f">Apache DocumentRoot</text>
  <text x="1040" y="244" text-anchor="middle" font-family="Menlo, Monaco, monospace" font-size="16" fill="#1b5e20">/app</text>

  <line x1="1040" y1="260" x2="1040" y2="300" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <rect x="780" y="310" width="520" height="70" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="1040" y="340" text-anchor="middle" font-family="Menlo, Monaco, monospace" font-size="16" fill="#1f1f1f">/app/index.php</text>
  <text x="1040" y="364" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#666666">Serve from Mount</text>

  <line x1="1040" y1="380" x2="1040" y2="460" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <rect x="780" y="460" width="520" height="70" rx="10" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2"/>
  <text x="1040" y="490" text-anchor="middle" font-family="Menlo, Monaco, monospace" font-size="16" fill="#1f1f1f">/app/index.php</text>
  <text x="1040" y="514" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#666666">Edit Path (Volume Mount)</text>

  <rect x="780" y="560" width="520" height="130" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="1040" y="600" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1b5e20">Serve from Mount (Live)</text>
  <text x="1040" y="635" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#333333">Edits at /app/index.php appear immediately</text>
  <text x="1040" y="658" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#333333">because Apache serves from /app.</text>

  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c62828"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2e7d32"/>
    </marker>
  </defs>
</svg>
