<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img">
  <rect width="1400" height="520" fill="#f7f7f8"/>
  <text x="700" y="48" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f1f1f">Image Mode for Application Developers</text>

  <rect x="80" y="110" width="520" height="300" rx="16" fill="#ffffff" stroke="#c62828" stroke-width="4"/>
  <rect x="110" y="140" width="240" height="42" rx="8" fill="#c62828"/>
  <text x="230" y="168" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Part 1 (Development)</text>
  <text x="340" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#333333">Volume Mounts</text>
  <text x="340" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#333333">Fast Iteration</text>
  <text x="340" y="310" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#333333">Mutable Files</text>

  <line x1="620" y1="260" x2="760" y2="260" stroke="#c62828" stroke-width="5"/>
  <polygon points="760,250 780,260 760,270" fill="#c62828"/>
  <text x="700" y="240" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#c62828">Same Application</text>

  <rect x="800" y="110" width="520" height="300" rx="16" fill="#ffffff" stroke="#424242" stroke-width="4"/>
  <rect x="830" y="140" width="220" height="42" rx="8" fill="#424242"/>
  <text x="940" y="168" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Part 2 (Production)</text>
  <text x="1060" y="230" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#333333">Bootable Image</text>
  <text x="1060" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#333333">COPY into Image</text>
  <text x="1060" y="310" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#333333">Immutable Deploy</text>

  <text x="700" y="470" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#555555">Lab 1 Builds the App. Lab 2 Packages It as Bootable.</text>
</svg>
