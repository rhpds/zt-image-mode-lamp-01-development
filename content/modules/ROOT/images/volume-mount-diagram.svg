<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img">
  <rect width="1400" height="620" fill="#f7f7f8"/>
  <text x="700" y="48" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#1f1f1f">Volume Mount</text>

  <rect x="60" y="110" width="520" height="360" rx="16" fill="#ffffff" stroke="#424242" stroke-width="3"/>
  <text x="320" y="155" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f1f1f">Host (buildhost)</text>
  <text x="320" y="200" text-anchor="middle" font-family="Menlo, Monaco, monospace" font-size="18" fill="#c62828">~/lamp-dev/app/</text>
  <text x="320" y="250" text-anchor="middle" font-family="Menlo, Monaco, monospace" font-size="16" fill="#333333">db-setup.sql</text>
  <text x="320" y="285" text-anchor="middle" font-family="Menlo, Monaco, monospace" font-size="16" fill="#333333">index.php</text>
  <text x="320" y="320" text-anchor="middle" font-family="Menlo, Monaco, monospace" font-size="16" fill="#333333">myapp.conf</text>

  <rect x="820" y="110" width="520" height="360" rx="16" fill="#ffffff" stroke="#424242" stroke-width="3"/>
  <text x="1080" y="155" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f1f1f">Container (lamp-dev-container)</text>
  <text x="1080" y="200" text-anchor="middle" font-family="Menlo, Monaco, monospace" font-size="18" fill="#c62828">/app/</text>
  <text x="1080" y="250" text-anchor="middle" font-family="Menlo, Monaco, monospace" font-size="16" fill="#333333">db-setup.sql</text>
  <text x="1080" y="285" text-anchor="middle" font-family="Menlo, Monaco, monospace" font-size="16" fill="#333333">index.php</text>
  <text x="1080" y="320" text-anchor="middle" font-family="Menlo, Monaco, monospace" font-size="16" fill="#333333">myapp.conf</text>

  <line x1="590" y1="260" x2="810" y2="260" stroke="#c62828" stroke-width="5"/>
  <polygon points="810,250 830,260 810,270" fill="#c62828"/>
  <line x1="810" y1="290" x2="590" y2="290" stroke="#c62828" stroke-width="5"/>
  <polygon points="590,280 570,290 590,300" fill="#c62828"/>
  <text x="700" y="235" text-anchor="middle" font-family="Menlo, Monaco, monospace" font-size="14" fill="#c62828">-v ~/lamp-dev/app:/app:z</text>

  <text x="700" y="540" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#333333">Edit on Host, Instant Inside Container</text>
</svg>
