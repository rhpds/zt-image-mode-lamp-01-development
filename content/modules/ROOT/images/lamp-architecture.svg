<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img">
  <rect width="1400" height="420" fill="#f7f7f8"/>
  <text x="700" y="48" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f1f1f">How the LAMP App Serves a Request</text>

  <!-- boxes -->
  <rect x="40" y="130" width="250" height="150" rx="14" fill="#ffffff" stroke="#424242" stroke-width="3"/>
  <text x="165" y="185" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f1f1f">Browser</text>
  <text x="165" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#555555">LAMP Application Tab</text>
  <text x="165" y="245" text-anchor="middle" font-family="Menlo, Monaco, monospace" font-size="14" fill="#c62828">localhost:8080</text>

  <rect x="370" y="130" width="250" height="150" rx="14" fill="#ffffff" stroke="#424242" stroke-width="3"/>
  <text x="495" y="185" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f1f1f">Apache (httpd)</text>
  <text x="495" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#555555">Web Server</text>
  <text x="495" y="245" text-anchor="middle" font-family="Menlo, Monaco, monospace" font-size="14" fill="#c62828">Port 80</text>

  <rect x="700" y="130" width="250" height="150" rx="14" fill="#ffffff" stroke="#424242" stroke-width="3"/>
  <text x="825" y="185" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f1f1f">PHP</text>
  <text x="825" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#555555">Application Logic</text>
  <text x="825" y="245" text-anchor="middle" font-family="Menlo, Monaco, monospace" font-size="14" fill="#c62828">index.php</text>

  <rect x="1030" y="130" width="330" height="150" rx="14" fill="#ffffff" stroke="#424242" stroke-width="3"/>
  <text x="1195" y="185" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f1f1f">MariaDB</text>
  <text x="1195" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#555555">Database</text>
  <text x="1195" y="245" text-anchor="middle" font-family="Menlo, Monaco, monospace" font-size="14" fill="#c62828">hellodb / greetings</text>

  <!-- arrows -->
  <line x1="290" y1="205" x2="360" y2="205" stroke="#c62828" stroke-width="4"/>
  <polygon points="360,195 380,205 360,215" fill="#c62828"/>
  <line x1="620" y1="205" x2="690" y2="205" stroke="#c62828" stroke-width="4"/>
  <polygon points="690,195 710,205 690,215" fill="#c62828"/>
  <line x1="950" y1="205" x2="1020" y2="205" stroke="#c62828" stroke-width="4"/>
  <polygon points="1020,195 1040,205 1020,215" fill="#c62828"/>

  <text x="700" y="360" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#555555">Host Port 8080 Maps to Container Port 80</text>
</svg>
