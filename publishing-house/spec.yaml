project:
  slug: "zt-image-mode-lamp-development"
  owner_email: "brthomas@redhat.com"
  content_type: "lab"
  deployment_mode: "self_published"
  initiative_key: "none"
  showroom_type: "zero_touch"
  intake_type: "new"
  automation_type: "ansible"
  description: "Build a database-backed LAMP application using containers and volume mounts for iterative development. Part 1 of 2-lab series on Image Mode for application developers."
  jira_ticket: ""
  workflow_id: ""

spec:
  title: "Build a LAMP Application Development Container"
  learning_objectives:
    - "Verify pre-configured registry authentication for Red Hat Container Registry"
    - "Build a LAMP (Linux, Apache, MariaDB, PHP) application development environment using RHEL UBI containers"
    - "Configure MariaDB databases with initialization scripts"
    - "Deploy PHP applications with Apache in containerized environments"
    - "Use volume mounts for iterative application development"
    - "Understand mutable development workflows versus immutable production workflows"
  modules:
    - id: module-01
      title: "Prepare Your Development Environment"
      duration_min: 6
      status: not_started
    - id: module-02
      title: "Build the LAMP Application"
      duration_min: 15
      status: not_started
    - id: module-03
      title: "Test and Iterate"
      duration_min: 7
      status: not_started
  environment:
    platform: "rhel-vms"
    topology: "per-student"
    cloud_provider: cnv
    max_concurrent_users: null

    # VM configuration
    vms_per_student:
      - role: "buildhost"
        count: 1
        cpu: 8
        ram_gb: 16
        disk_gb: 150
        os: "rhel-10"

