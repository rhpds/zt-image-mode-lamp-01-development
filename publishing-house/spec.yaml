approval_checklist:
  content:
    prerequisites_verifiable: false
    assessment_strategy: ""
    catalog_gap: "Existing Image Mode labs focus on platform engineers managing OS images at scale with security/compliance (e.g., 'Image Mode is the best mode' - 180min, operations-focused). This lab series targets application developers learning to package their applications with Image Mode. This is Part 1: development workflow with containers and volumes. Part 2 teaches production packaging as bootable images. Unique value: teaches the volume mount (mutable dev) vs COPY (immutable prod) transformation that ops-focused labs don't cover."
    design_overview: "A beginner lab teaching application developers how to build LAMP applications in containers using volume mounts for iterative development. Students verify pre-configured registry authentication, build a development container with MariaDB/Apache/PHP, create a database-backed PHP application using volume mounts, and test the mutable development workflow. Emphasizes hands-on CLI workflow with 80% executable commands. Part 1 of 2-lab series; Part 2 covers production packaging with bootable containers."
    module_summaries:
      - title: "Prepare Your Development Environment"
        overview: "Verify pre-configured registry authentication, review workspace structure, examine the development Containerfile, and build the base LAMP container image with MariaDB, Apache, and PHP."
      - title: "Build the LAMP Application"
        overview: "Run container with volume mounts, create database schema and seed data, write PHP application with database connectivity, deploy to Apache, configure SELinux, and test the application."
      - title: "Test and Iterate"
        overview: "Verify end-to-end functionality, add database records, modify application code on host, demonstrate instant updates via volume mounts, and understand mutable development workflow versus immutable production."
    rcars_overlap_pct: 0
    rcars_top_matches: []
    rejections: []

  infra:
    peak_environments: null
    cost_per_run_est: ""
    provisioning_time_est: ""
    agnosticv_base_ci: ""
    approved_by: ""
    rejections: []
